name: mindtamer
description: MindTamer – pixel-style mental health companion with gamified loop (Flutter + Flame)
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  in_app_purchase: ^3.2.0
  flame: ^1.14.0
  csv: ^6.0.0
  archive: ^3.6.1
  path_provider: ^2.1.3
  share_plus: ^10.0.2
  uuid: ^4.5.1
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.1+2
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  timezone: ^0.9.4
  provider: ^6.0.0
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  fl_chart: ^0.69.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  isar_generator: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Explicitly include items dir to ensure bundling on hot restart
    - assets/images/items/
    - assets/images/items/potions/
    - assets/images/items/food/
    - assets/images/items/debuffs/
    - assets/images/items/bombs/
    - assets/images/items/elixirs/
    - assets/images/items/scrolls/
    - assets/images/items/talismans/
    - assets/images/backgrounds/
    - assets/images/players/
    - assets/images/weapons/
    - assets/images/armor/
    # Explicitly include armor class directories to ensure bundling during hot reload
    - assets/images/armor/alchemist/
    - assets/images/armor/alchemist/early/
    - assets/images/armor/alchemist/mid/
    - assets/images/armor/alchemist/late/
    - assets/images/armor/artificer/
    - assets/images/armor/artificer/early/
    - assets/images/armor/artificer/mid/
    - assets/images/armor/artificer/late/
    - assets/images/armor/empath/
    - assets/images/armor/empath/early/
    - assets/images/armor/empath/mid/
    - assets/images/armor/empath/late/
    - assets/images/armor/oracle/
    - assets/images/armor/oracle/early/
    - assets/images/armor/oracle/mid/
    - assets/images/armor/oracle/late/
    - assets/images/armor/sage/
    - assets/images/armor/sage/early/
    - assets/images/armor/sage/mid/
    - assets/images/armor/sage/late/
    - assets/images/armor/seer/
    - assets/images/armor/seer/early/
    # Seer currently has early only
    - assets/images/armor/sentinel/
    - assets/images/armor/sentinel/early/
    # Sentinel currently has early only
    - assets/images/armor/shadow/
    - assets/images/armor/shadow/early/
    # Shadow currently has early only
    - assets/images/armor/trickster/
    - assets/images/armor/trickster/early/
    # Trickster currently has early only
    - assets/images/armor/warden/
    - assets/images/armor/warden/early/
    # Warden currently has early only
    - assets/images/accessories/
    - assets/images/crafting/
    - assets/images/monsters/
    - assets/data/
    - assets/lexicon/v1/
    # Explicitly include tab icons to ensure bundling
    - assets/images/icons/tab_home_32.png
    - assets/images/icons/tab_mood_32.png
    - assets/images/icons/tab_journal_32.png
    - assets/images/icons/tab_meds_32.png
    - assets/images/icons/tab_settings_32.png
    # Explicit slot placeholders to ensure bundling
    - assets/images/ui/slots/ring_empty_32.png
    - assets/images/ui/slots/hand_empty_32.png
    - assets/images/ui/slots/chest_empty_32.png
  fonts:
    - family: PixelFont
      fonts:
        - asset: assets/fonts/PlaceholderPixelFont.ttf
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
